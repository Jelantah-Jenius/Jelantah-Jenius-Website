<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Videos - Jelantah Jenius</title>
  <link rel="stylesheet" href="style.css" />
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" />
  <link rel="icon" href="attached_assets/JJ%20Logo.png" sizes="any">
  <link rel="icon" href="attached_assets/JJ%20Logo.png" type="image/png">
  <link rel="apple-touch-icon" href="attached_assets/JJ%20Logo.png">
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      background: linear-gradient(
        to top, 
        #4a541b 0%,     
        #f7d36a 50%,    
        #ffffff 100%    
      );
      background-attachment: fixed;
      background-size: cover;
      overflow-x: hidden;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      font-family: Arial, sans-serif;
    }

    /* --- PAGE CONTAINER & YELLOW BOX --- */
    .main-container {
      flex: 1;
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 10rem 1rem 4rem 1rem; /* Adjusted padding to clear fixed navbar */
    }

    .huge-yellow-box {
      max-width: 900px;
      width: 100%;
      padding: 3rem 2rem;
      background-color: #fffde7;
      border: 2px solid #f0e68c;
      border-radius: 25px;
      box-shadow: 0 10px 30px rgba(0, 0, 0, 0.1);
      margin: 0 auto;
      text-align: center;
    }

    .huge-yellow-box h3 {
      color: #4a541b;
      font-size: 2.2rem;
      margin-bottom: 2.5rem;
      font-weight: 800;
    }
  </style>
</head>
<body>
  <nav id="navbar">
    <div class="navbar">
      <div class="logo">
        <a href="/">
          <img src="attached_assets/JJ New Logo w Shadow.png" alt="Logo">
          Jelantah Jenius
        </a>
      </div>
      <ul class="menu">
        <div class="cancel-btn"><i class="fas fa-times"></i></div>
        <li><a href="/">Home</a></li>
        <li><a href="/about">About Us</a></li>
        
        <li class="dropdown">
          <a href="javascript:void(0)" class="dropbtn active">Contents <i class="fas fa-chevron-down" style="font-size: 0.8rem; margin-left: 5px;"></i></a>
          <ul class="dropdown-content">
            <li><a href="/articles">Articles</a></li>
            <li><a href="/videos" class="active">Videos</a></li>
          </ul>
        </li>
        
        <li><a href="/programs">Programs</a></li>
        <li><a href="/batches">Batches</a></li>
        <li><a href="/contact">Contact Us</a></li>
      </ul>
      <div class="menu-btn"><i class="fas fa-bars"></i></div>
    </div>
  </nav>

  <main class="main-container">
    <section class="huge-yellow-box">
      <h3>Video Gallery</h3>
      <p style="color: #4b5563; font-size: 1.1rem;">Video content is coming soon! Stay tuned.</p>
    </section>
  </main>

  <script src="script.js"></script>
</body>
</html>
