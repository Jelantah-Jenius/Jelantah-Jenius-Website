<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Thank You! - Jelantah Jenius</title>
  <link rel="stylesheet" href="style.css" />
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" />
  <link rel="icon" href="attached_assets/JJ%20Logo.png" type="image/png" />
  <link rel="apple-touch-icon" href="attached_assets/JJ%20Logo.png" />
  <link rel="canonical" href="https://jelantahjenius.com/thank-you" />
</head>
<body>

  <!-- Navigation Bar -->
  <nav id="navbar">
    <div class="navbar">
      <div class="logo">
        <a href="index.html">
          <img src="attached_assets/JJ New Logo w Shadow.png" alt="Logo">
          Jelantah Jenius
        </a>
      </div>
      <ul class="menu">
        <div class="cancel-btn"><i class="fas fa-times"></i></div>
        <li><a href="/">Home</a></li>
        <li><a href="/about">About Us</a></li>
        <li><a href="/articles">Articles</a></li>
        <li><a href="/programs">Programs</a></li>
        <li><a href="/batches">Batches</a></li>
        <li><a href="/contact">Contact Us</a></li>
      </ul>
      <div class="menu-btn"><i class="fas fa-bars"></i></div>
    </div>
  </nav>

  <!-- Thank You Container -->
<section class="about" style="padding-top: 80px; min-height: calc(100vh - 120px); display: flex; align-items: center; justify-content: center;">
  <main style="width: 100%; display: flex; justify-content: center;">
    <div class="content">
      <div class="team-grid">
        <div class="team-card" style="box-shadow: 0 15px 35px rgba(0, 0, 0, 0.14);">
          <div class="avatar" style="background-image: url('attached_assets/JJ Logo.png')"></div>
          <h2>Message Sent!</h2>
          <p>Thank you for reaching out to Jelantah Jenius. We have received your inquiry and will get back to you shortly.</p>
          <div class="cta-group" style="padding-top: 20px; display: flex; justify-content: center;">
            <a href="/contact" style="padding: 1.5rem 2rem; height: 20px; background: var(--primary); color: white; border-radius: 100px; box-shadow: 0 15px 35px rgba(74, 84, 27, 0.3); transition: var(--transition); text-decoration: none; font-weight: 700; display: flex; align-items: center;" onmouseover="this.style.transform='translateY(-5px)'; this.style.boxShadow='0 20px 45px rgba(74, 84, 27, 0.4)';" onmouseout="this.style.transform='translateY(0)'; this.style.boxShadow='0 15px 35px rgba(74, 84, 27, 0.3)';">Return</a>
          </div>
        </div>
      </div>
    </div>
  </main>
</section>

</body>
</html>
