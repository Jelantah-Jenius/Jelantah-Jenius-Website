<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Articles - Jelantah Jenius</title>
  <link rel="stylesheet" href="style.css" />
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" />
  <link rel="icon" href="attached_assets/JJ%20Logo.png" sizes="any">
  <link rel="icon" href="attached_assets/JJ%20Logo.png" type="image/png">
  <link rel="apple-touch-icon" href="attached_assets/JJ%20Logo.png">
  <link rel="canonical" href="https://jelantahjenius.com/articles" />
  <style>
    body {
      background: linear-gradient(
        to top, 
        #4a541b 0%,     
        #f7d36a 50%,    
        #ffffff 100%    
      );
      background-attachment: fixed;
      background-size: cover;
      overflow-x: hidden;
    }

    /* --- CSS UNTUK MENU DROPDOWN --- */
    .menu li.dropdown {
      position: relative;
    }
    
    .menu li.dropdown .dropdown-content {
      display: none;
      position: absolute;
      top: 100%;
      left: 0;
      background-color: #ffffff;
      min-width: 160px;
      box-shadow: 0px 8px 20px rgba(0,0,0,0.15);
      border-radius: 10px;
      z-index: 100;
      padding: 0.5rem 0;
      list-style: none;
      overflow: hidden;
    }
    
    .menu li.dropdown:hover .dropdown-content,
    .menu li.dropdown:focus-within .dropdown-content {
      display: block;
    }
    
    .menu li.dropdown .dropdown-content li {
      margin: 0;
      display: block;
    }
    
    .menu li.dropdown .dropdown-content li a {
      color: var(--primary, #4a541b);
      padding: 12px 20px;
      text-decoration: none;
      display: block;
      font-size: 1rem;
      font-weight: 600;
      transition: all 0.3s ease;
    }
    
    .menu li.dropdown .dropdown-content li a:hover {
      background-color: #f7d36a;
      color: #000;
      transform: none; 
    }

    /* --- CSS UNTUK LIGHT YELLOW BOX --- */
    .huge-yellow-box {
      max-width: 1200px;
      margin: 10rem auto 5rem auto; /* Added padding-top spacing via margin for fixed navbar */
      padding: 3rem 2rem;
      background-color: #fffde7;
      border: 2px solid #f0e68c;
      border-radius: 25px;
      box-shadow: 0 15px 35px rgba(0, 0, 0, 0.08);
      width: 90%;
    }

    .huge-yellow-box h3 {
      text-align: center;
      color: #4a541b;
      font-size: 2rem;
      margin-bottom: 2rem;
      font-weight: 800;
    }

    .article-images-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(280px, 1fr));
      gap: 2rem;
      justify-items: center;
      align-items: center;
    }

    .article-images-grid img {
      width: 100%;
      max-width: 350px;
      height: 250px;
      object-fit: cover;
      border-radius: 15px;
      box-shadow: 0 8px 20px rgba(0, 0, 0, 0.1);
      transition: transform 0.3s ease, box-shadow 0.3s ease;
    }

    .article-images-grid img:hover {
      transform: translateY(-5px);
      box-shadow: 0 12px 25px rgba(0, 0, 0, 0.15);
    }

    @media (max-width: 768px) {
      .menu li.dropdown .dropdown-content {
        position: static;
        box-shadow: none;
        background-color: transparent;
        padding-left: 1.5rem;
        display: none;
      }
      .menu li.dropdown:hover .dropdown-content,
      .menu li.dropdown:focus-within .dropdown-content {
        display: block;
      }
      .menu li.dropdown .dropdown-content li a {
        padding: 8px 20px;
        color: #ffffff;
      }
      .menu li.dropdown .dropdown-content li a:hover {
        background-color: rgba(255,255,255,0.1);
        color: #f7d36a;
      }
    }
  </style>
</head>
<body>
  <nav id="navbar">
    <div class="navbar">
      <div class="logo">
        <a href="/">
          <img src="attached_assets/JJ New Logo w Shadow.png" alt="Logo">
          Jelantah Jenius
        </a>
      </div>
      <ul class="menu">
        <div class="cancel-btn"><i class="fas fa-times"></i></div>
        <li><a href="/">Home</a></li>
        <li><a href="/about">About Us</a></li>
        
        <li class="dropdown">
          <a href="javascript:void(0)" class="dropbtn active">Contents <i class="fas fa-chevron-down" style="font-size: 0.8rem; margin-left: 5px;"></i></a>
          <ul class="dropdown-content">
            <li><a href="/articles">Articles</a></li>
            <li><a href="/videos">Videos</a></li>
          </ul>
        </li>
        
        <li><a href="/programs">Programs</a></li>
        <li><a href="/batches">Batches</a></li>
        <li><a href="/contact">Contact Us</a></li>
      </ul>
      <div class="menu-btn"><i class="fas fa-bars"></i></div>
    </div>
  </nav>

  <!-- Huge Light Yellow Box Section -->
  <section class="huge-yellow-box">
    <h3>Article Gallery</h3>
    <div class="article-images-grid">
      <img src="attached_assets/article1.jpeg" alt="Article 1">
      <img src="attached_assets/article2.jpeg" alt="Article 2">
      <img src="attached_assets/article3.jpeg" alt="Article 3">
    </div>
  </section>

  <script src="script.js"></script>
</body>
</html>
