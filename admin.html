<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Admin Area - Jelantah Jenius</title>
  <link rel="stylesheet" href="style.css" />
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" />
  <link rel="icon" href="attached_assets/JJ%20Logo.png" sizes="any">
  <style>
    body {
      display: flex;
      justify-content: center;
      align-items: center;
      height: 100vh;
      background: var(--bg-light);
      margin: 0;
    }
  </style>
</head>
<body>

  <div class="login-container">
    <a href="/">
      <img src="attached_assets/JJ New Logo w Shadow.png" alt="Logo">
    </a>
    <h2>Admin Access</h2>
    
    <form id="adminLoginForm" class="login-form">
      <input type="email" id="emailInput" placeholder="Admin Email" required>
      <input type="password" id="passwordInput" placeholder="Password" required>
      <button type="submit" class="btn-submit" id="loginBtnText">Secure Login</button>
    </form>
    
    <p id="errorMessage"></p>
  </div>

  <!-- Firebase Integration -->
  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.1/firebase-app.js";
    import { getAuth, signInWithEmailAndPassword } from "https://www.gstatic.com/firebasejs/10.8.1/firebase-auth.js";

    const firebaseConfig = {
      apiKey: "AIzaSyAWpSh4iWGc8ZmvMBfbPDqbZ-HHkqOce3U",
      authDomain: "jelantahjenius-id.firebaseapp.com",
      projectId: "jelantahjenius-id",
      storageBucket: "jelantahjenius-id.firebasestorage.app",
      messagingSenderId: "893307998743",
      appId: "1:893307998743:web:20025ac8f89eb6a6b70252",
      measurementId: "G-3CFN0TDGHZ"
    };

    const app = initializeApp(firebaseConfig);
    const auth = getAuth(app);

    const loginForm = document.getElementById('adminLoginForm');
    const emailInput = document.getElementById('emailInput');
    const passwordInput = document.getElementById('passwordInput');
    const errorMessage = document.getElementById('errorMessage');
    const loginBtnText = document.getElementById('loginBtnText');

    loginForm.addEventListener('submit', async (e) => {
      e.preventDefault();
      
      const email = emailInput.value;
      const password = passwordInput.value;
      
      errorMessage.style.display = 'none';
      loginBtnText.textContent = "Authenticating...";

      try {
        await signInWithEmailAndPassword(auth, email, password);
        // Jika berhasil, arahkan kembali ke halaman TopContribution
        window.location.href = "top-contribution.html";
      } catch (error) {
        errorMessage.textContent = "Invalid email or password.";
        errorMessage.style.display = 'block';
        loginBtnText.textContent = "Secure Login";
      }
    });
  </script>
</body>
</html>
