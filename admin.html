<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Admin Area - Jelantah Jenius</title>
  <link rel="stylesheet" href="style.css" />
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" />
  <link rel="icon" href="attached_assets/JJ%20Logo.png" sizes="any">
  <style>
    body {
      display: flex;
      justify-content: center;
      align-items: center;
      height: 100vh;
      background: var(--bg-light);
      margin: 0;
    }
    .login-container {
      background: var(--white);
      padding: 3rem;
      border-radius: 30px;
      box-shadow: 0 20px 40px rgba(0,0,0,0.05);
      width: 100%;
      max-width: 400px;
      text-align: center;
    }
    .login-container img {
      width: 80px;
      margin-bottom: 1.5rem;
    }
    .login-container h2 {
      color: var(--primary);
      margin-bottom: 2rem;
      font-weight: 800;
    }
    .login-form {
      display: flex;
      flex-direction: column;
      gap: 1.5rem;
    }
    .login-form input {
      padding: 1rem 1.5rem;
      border: 1px solid rgba(0,0,0,0.1);
      border-radius: 15px;
      font-size: 1rem;
      font-family: inherit;
      outline: none;
      transition: var(--transition);
    }
    .login-form input:focus {
      border-color: var(--secondary);
      box-shadow: 0 0 0 3px rgba(249, 163, 26, 0.1);
    }
    .btn-submit {
      background: var(--primary);
      color: white;
      padding: 1rem;
      border: none;
      border-radius: 15px;
      font-size: 1.1rem;
      font-weight: 700;
      cursor: pointer;
      transition: var(--transition);
      margin-top: 0.5rem;
    }
    .btn-submit:hover {
      background: var(--accent);
      transform: translateY(-2px);
      box-shadow: 0 10px 20px rgba(74, 84, 27, 0.2);
    }
    #errorMessage {
      color: #dc3545;
      font-size: 0.9rem;
      margin-top: 1rem;
      display: none;
    }
  </style>
</head>
<body>

  <div class="login-container">
    <a href="/">
      <img src="attached_assets/JJ New Logo w Shadow.png" alt="Logo">
    </a>
    <h2>Admin Access</h2>
    
    <form id="adminLoginForm" class="login-form">
      <input type="email" id="emailInput" placeholder="Admin Email" required>
      <input type="password" id="passwordInput" placeholder="Password" required>
      <button type="submit" class="btn-submit" id="loginBtnText">Secure Login</button>
    </form>
    
    <p id="errorMessage"></p>
  </div>

  <!-- Firebase Integration -->
  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.1/firebase-app.js";
    import { getAuth, signInWithEmailAndPassword } from "https://www.gstatic.com/firebasejs/10.8.1/firebase-auth.js";

    const firebaseConfig = {
      apiKey: "AIzaSyAWpSh4iWGc8ZmvMBfbPDqbZ-HHkqOce3U",
      authDomain: "jelantahjenius-id.firebaseapp.com",
      projectId: "jelantahjenius-id",
      storageBucket: "jelantahjenius-id.firebasestorage.app",
      messagingSenderId: "893307998743",
      appId: "1:893307998743:web:20025ac8f89eb6a6b70252",
      measurementId: "G-3CFN0TDGHZ"
    };

    const app = initializeApp(firebaseConfig);
    const auth = getAuth(app);

    const loginForm = document.getElementById('adminLoginForm');
    const emailInput = document.getElementById('emailInput');
    const passwordInput = document.getElementById('passwordInput');
    const errorMessage = document.getElementById('errorMessage');
    const loginBtnText = document.getElementById('loginBtnText');

    loginForm.addEventListener('submit', async (e) => {
      e.preventDefault();
      
      const email = emailInput.value;
      const password = passwordInput.value;
      
      errorMessage.style.display = 'none';
      loginBtnText.textContent = "Authenticating...";

      try {
        await signInWithEmailAndPassword(auth, email, password);
        // Jika berhasil, arahkan kembali ke halaman TopContribution
        window.location.href = "TopContribution.html";
      } catch (error) {
        errorMessage.textContent = "Invalid email or password.";
        errorMessage.style.display = 'block';
        loginBtnText.textContent = "Secure Login";
      }
    });
  </script>
</body>
</html>
